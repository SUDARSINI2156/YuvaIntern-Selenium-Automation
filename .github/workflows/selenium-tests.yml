name: Selenium Automation CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install Google Chrome
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      # Step 4: Install project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 5: Start Flask application
      - name: Start Flask application
        run: |
          nohup python app.py > app.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/; then
              echo "Flask application started successfully"
              break
            fi

            sleep 2
          done

          echo "Flask application logs:"
          cat app.log

          curl -f http://127.0.0.1:5000/

      # Step 6: Execute Selenium tests
      - name: Run Selenium tests
        env:
          HEADLESS: "true"
          BASE_URL: "http://127.0.0.1:5000"
        run: |
          python -m pytest

      # Step 7: Upload HTML test report
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-report
          path: reports/report.html
          if-no-files-found: warn

      # Step 8: Upload Flask logs
      - name: Upload Flask logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flask-application-logs
          path: app.log
          if-no-files-found: warn
